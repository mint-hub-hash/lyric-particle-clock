<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyric Particle Clock — 音乐粒子时钟</title>
<meta name="description" content="Full-screen audio-reactive particle clock for your desktop. 10 motion modes, beat explosions, and automatically synced lyrics (local Whisper or LRCLIB).">
<style>
:root{color-scheme:dark;--bg:#05060a;--fg:#e8ecff;--dim:rgba(232,236,255,.55)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0;transition:opacity .6s}
.btn{font:inherit;font-size:13px;color:var(--fg);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover,.btn:focus-visible{background:rgba(255,255,255,.18);outline:none}
.btn.on{border-color:#7df;color:#7df}
#modeName{margin-left:auto;font-size:14px;color:var(--dim)}
#note{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);text-align:center;font-size:13px;color:#7df;opacity:0;transition:opacity .4s;pointer-events:none}
#date{position:fixed;left:0;right:0;text-align:center;color:var(--dim);letter-spacing:.3em;pointer-events:none}
#sub{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);text-align:center;padding:0 6vw;font-size:clamp(16px,2.4vw,30px);line-height:1.5;text-shadow:0 0 18px rgba(0,0,0,.9);opacity:0;transition:opacity 1.2s;pointer-events:none}
#sub small{display:block;margin-top:6px;font-size:.55em;color:var(--dim)}
#sub.show{opacity:1}
#sub.lyric{transition:opacity .25s}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:center;font-size:12px;color:var(--dim);transition:opacity .6s}
body.idle #ui,body.idle #hint{opacity:0;pointer-events:none}
body.idle{cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="date"></div>
<div id="sub"></div>
<div id="note"></div>
<div id="ui">
  <button class="btn" id="bMic">麦克风</button>
  <label class="btn" for="file">本地音乐 / 歌词</label><input id="file" type="file" accept="audio/*,.lrc,.txt" multiple hidden>
  <button class="btn" id="bDemo">演示节拍</button>
  <button class="btn" id="bPrev">上一模式</button>
  <button class="btn" id="bNext">下一模式</button>
  <button class="btn on" id="bAuto">自动切换</button>
  <button class="btn" id="bFs">全屏</button>
  <span id="modeName"></span>
</div>
<div id="hint">按 1–9、0 切换 10 种起伏模式 · F 全屏 · 空格 暂停/播放 · [ ] 微调歌词快慢</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas'),octx=off.getContext('2d',{willReadFrequently:true});
const $=id=>document.getElementById(id);
const N=3200,BINS=128;
let W,H,DPR,size,cy,lastStr='',hue=200;
const P=[];for(let i=0;i<N;i++)P.push({i,x:0,y:0,vx:0,vy:0,tx:0,ty:0,u:0,v:0,r:Math.random()});

/* ---------- 音频 ---------- */
let ac,an,out,fd,srcNode,stream,audioEl,fileSrc,src='demo';
const raw=new Float32Array(BINS),sm=new Float32Array(BINS);
function initAC(){
  if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  an=ac.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.65;
  out=ac.createGain();an.connect(out);out.connect(ac.destination);
  fd=new Uint8Array(an.frequencyBinCount);
}
function stopSrc(){
  if(srcNode){try{srcNode.disconnect()}catch(e){}srcNode=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(audioEl)audioEl.pause();
}
async function useMic(){
  try{
    initAC();await ac.resume();
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    stopSrc();stream=s;srcNode=ac.createMediaStreamSource(s);srcNode.connect(an);
    out.gain.value=0;src='mic';note('麦克风已接入');
  }catch(e){stopRecog();note('无法使用麦克风（可能被浏览器或嵌入环境拦截），请改用本地音乐')}
}
let lyrics=[],lyricOff=0,lyricShown=null,lyricTimer;
function parseLRC(t){
  const r=[];
  for(const ln of t.split(/\r?\n/)){
    const ts=[...ln.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if(!ts.length)continue;
    const tx=ln.replace(/\[[^\]]*\]/g,'').trim();
    for(const m of ts)r.push({t:+m[1]*60+ +m[2],s:tx});
  }
  return r.sort((a,b)=>a.t-b.t);
}
async function useFiles(fs){
  const isL=f=>/\.(lrc|txt)$/i.test(f.name);
  const lrc=fs.find(isL),aud=fs.find(f=>!isL(f));
  if(lrc){lyrics=parseLRC(await lrc.text());lyricOff=0}
  else if(aud)lyrics=[];
  if(aud)useFile(aud);
  else if(lrc)note('已载入歌词：'+lyrics.length+' 行');
  if(aud&&!lrc)autoLyrics(aud);
}
let lyricJob=0;
async function readTags(f){
  try{
    const b=new Uint8Array(await f.slice(0,300000).arrayBuffer());
    if(String.fromCharCode(b[0],b[1],b[2])!=='ID3')return{};
    const ver=b[3],end=Math.min(b.length,10+((b[6]<<21)|(b[7]<<14)|(b[8]<<7)|b[9]));
    let p=10;const o={};
    while(p+10<end){
      const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);
      if(!/^[A-Z0-9]{4}$/.test(id))break;
      const sz=ver===4?((b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]):((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7]);
      if(id==='TIT2'||id==='TPE1'){
        const e=b[p+10],d=b.subarray(p+11,p+10+sz);
        const enc=e===0?'iso-8859-1':e===3?'utf-8':(e===2||d[0]===0xFE)?'utf-16be':'utf-16le';
        o[id==='TIT2'?'title':'artist']=new TextDecoder(enc).decode(d).replace(/\0+$/,'').trim();
      }
      if(sz<=0)break;p+=10+sz;
    }
    return o;
  }catch(e){return{}}
}
/* 本机识别：把歌曲发给 lyrics_server.py（faster-whisper 轻量模型），边识别边显示带时间的歌词 */
async function localLyrics(f,my){
  const base=location.protocol==='http:'?'':'http://127.0.0.1:8765';
  const c1=new AbortController();setTimeout(()=>c1.abort(),1500);
  const pr=await fetch(base+'/api/ping',{signal:c1.signal});
  if(!pr.ok)return false;
  const info=await pr.json();
  note('本机模型识别歌词中（'+info.model+'，'+info.device+'）…');
  lyrics=[];lyricOff=0;
  const r=await fetch(base+'/api/transcribe?name='+encodeURIComponent(f.name),{method:'POST',body:f,headers:{'Content-Type':'application/octet-stream'}});
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const {done,value}=await rd.read();if(done)break;
    if(my!==lyricJob){rd.cancel();return true}
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      const ln=buf.slice(0,i);buf=buf.slice(i+1);if(!ln.trim())continue;
      const o=JSON.parse(ln);
      if(o.text){lyrics.push({t:o.start,s:o.text});lyrics.push({t:o.end,s:''})}
      if(o.error)note('本机识别出错：'+o.error);
      if(o.done)note(lyrics.length?'本机歌词识别完成（语言：'+o.language+'）':'没有识别到人声歌词');
    }
  }
  return true;
}
/* 自动检测：用歌曲标签或文件名到 LRCLIB 查找逐句同步歌词 */
async function autoLyrics(f){
  const my=++lyricJob;
  try{
    if(await localLyrics(f,my).catch(()=>false))return;
    const m=await readTags(f);let title=m.title,artist=m.artist;
    if(!title){
      const b=f.name.replace(/\.[^.]+$/,'').replace(/^\d+[\s._-]+/,'');
      const i=b.indexOf(' - ');
      if(i>0){artist=b.slice(0,i).trim();title=b.slice(i+3).trim()}else title=b.trim();
    }
    note('正在自动查找歌词：'+(artist?artist+' - ':'')+title);
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),9000);
    const r=await fetch('https://lrclib.net/api/search?q='+encodeURIComponent((artist?artist+' ':'')+title),{signal:ctl.signal});
    const arr=(await r.json()).filter(x=>x.syncedLyrics);
    const dur=audioEl&&audioEl.duration;
    if(dur)arr.sort((a,b)=>Math.abs((a.duration||0)-dur)-Math.abs((b.duration||0)-dur));
    if(my!==lyricJob)return;
    if(!arr.length){note('没找到同步歌词，可手动选 .lrc');return}
    lyrics=parseLRC(arr[0].syncedLyrics);lyricOff=0;
    note('已自动匹配歌词：'+arr[0].artistName+' - '+arr[0].trackName);
  }catch(e){
    if(my===lyricJob)note('自动找歌词失败：请在本机运行 lyrics_server.py 并用它打开的网址（本机轻量模型识别），或手动选 .lrc');
  }
}
/* 麦克风模式：实时语音识别当字幕（尽力而为，唱歌准确度有限） */
let recogStopFn=null,liveText='',liveAt=0,dict=null;
function showLive(t){
  t=(t||'').trim();if(!t)return;
  liveText=t.slice(-60);liveAt=performance.now();
  sub.classList.add('lyric');sub.textContent=liveText;sub.classList.add('show');
}
function startRecog(){
  stopRecog();
  if(dict){dict.start().catch(()=>{});recogStopFn=()=>dict.stop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  const r=new SR();r.continuous=true;r.interimResults=true;r.lang=navigator.language||'zh-TW';
  r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;showLive(t)};
  r.onend=()=>{if(recogStopFn){try{r.start()}catch(_){}}};
  recogStopFn=()=>{recogStopFn=null;r.stop()};
  try{r.start()}catch(e){recogStopFn=null}
}
function stopRecog(){
  const s=recogStopFn;recogStopFn=null;liveText='';
  if(s){try{s()}catch(e){}}
}
function useFile(f){
  if(!f)return;
  initAC();ac.resume();stopRecog();stopSrc();
  if(!audioEl){audioEl=new Audio();audioEl.loop=true;fileSrc=ac.createMediaElementSource(audioEl)}
  else URL.revokeObjectURL(audioEl.src);
  audioEl.src=URL.createObjectURL(f);
  fileSrc.connect(an);srcNode=fileSrc;out.gain.value=1;
  audioEl.play().catch(()=>note('浏览器拦截了自动播放，请按空格'));
  src='file';note('正在播放：'+f.name+(lyrics.length?'（含歌词 '+lyrics.length+' 行）':''));
}
function useDemo(){stopRecog();stopSrc();src='demo';note('演示节拍')}
function demoSpec(t){
  const beat=t*2.0,ph=beat%1,kick=Math.exp(-ph*6),hat=Math.exp(-((beat*2)%1)*4);
  for(let i=0;i<BINS;i++){
    const f=i/BINS;
    let v=i<8?kick*(250-i*14):0;
    v+=(.5+.5*Math.sin(t*(1.2+i*.11)+i))*hat*150*(1-f*.75);
    v+=(Math.sin(t*.7+i*.3)*.5+.5)*70*(1-f);
    raw[i]=Math.max(0,v+Math.random()*12);
  }
}
function readSpec(t){
  if(src==='demo'||!an){demoSpec(t);return}
  an.getByteFrequencyData(fd);
  for(let i=0;i<BINS;i++)raw[i]=fd[i];
}

/* ---------- 布局与时钟目标点 ---------- */
const dateEl=$('date');
function layout(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  off.width=W;off.height=H;
  size=Math.min(W/5.6,H*.4);cy=H*.46;lastStr='';
  dateEl.style.top=(cy+size*.52)+'px';dateEl.style.fontSize=Math.max(12,size*.1)+'px';
  ctx.fillStyle='#05060a';ctx.fillRect(0,0,W,H);
}
function buildTargets(str){
  octx.clearRect(0,0,W,H);octx.fillStyle='#fff';
  octx.font='800 '+size+'px ui-monospace,Menlo,Consolas,"Courier New",monospace';
  octx.textAlign='center';octx.textBaseline='middle';octx.fillText(str,W/2,cy);
  const y0=Math.max(0,Math.floor(cy-size*.7)),hh=Math.min(H-y0,Math.ceil(size*1.4));
  const d=octx.getImageData(0,y0,W,hh).data,step=Math.max(3,Math.round(size/44)),pts=[];
  for(let y=0;y<hh;y+=step)for(let x=0;x<W;x+=step)
    if(d[(y*W+x)*4+3]>120)pts.push([x+(Math.random()-.5)*step*.6,y0+y+(Math.random()-.5)*step*.6]);
  if(!pts.length)return;
  pts.sort((a,b)=>a[0]-b[0]);
  const n=pts.length;
  for(let i=0;i<N;i++){
    const q=pts[Math.floor(i*n/N)],p=P[i];
    p.tx=q[0];p.ty=q[1];p.u=q[0]/W;p.v=(q[1]-cy)/(size*.4);
  }
}

/* ---------- 10 种上下起伏模式 ---------- */
let L=0,B=0,T=0;
const S=u=>sm[Math.min(BINS-1,Math.floor(Math.pow(u,1.5)*90))]/255;
const MODES=[
  ['正弦波浪',p=>Math.sin(p.u*12-T*4)*(.5+L)],
  ['频谱柱',p=>-S(Math.floor(p.u*48)/48)*1.6],
  ['镜像展开',p=>Math.sign(p.v)*S(p.u)*1.4],
  ['中心涟漪',p=>Math.sin(Math.hypot(p.tx-W/2,(p.ty-cy)*1.5)*.02-T*6)*(.3+L*1.2)],
  ['呼吸缩放',p=>p.v*(Math.sin(T*2)*.3+B*1.3)],
  ['弹跳',p=>-Math.abs(Math.sin(T*3+p.u*5))*(.4+L*1.4)],
  ['瀑布',p=>{const f=((p.u*3-T*.8)%1+1)%1;return(f-.5)*2*(.3+L*1.5)}],
  ['随机颤动',p=>Math.sin(T*25+p.r*60)*(B*1.6+L*.4)],
  ['双螺旋',p=>(p.i%2?1:-1)*Math.sin(p.u*9-T*3)*(.5+L*1.2)],
  ['帘幕下垂',p=>(p.v+1)*.5*S(p.u)*2.2]
];
let mode=0,auto=true,modeT=0;
function setMode(i){
  mode=(i+MODES.length)%MODES.length;modeT=performance.now();
  $('modeName').textContent='模式 '+(mode+1)+'/10 · '+MODES[mode][0];
}

/* ---------- 台词字幕 ---------- */
const QUOTES=[
  ['生活就像一盒巧克力，你永远不知道下一颗是什么味道。','《阿甘正传》'],
  ['希望是美好的，也许是人间至善，而美好的事物永不消逝。','《肖申克的救赎》'],
  ['如果非要在这份爱上加一个期限，我希望是一万年。','《大话西游》'],
  ['愿原力与你同在。','《星球大战》'],
  ['I’ll be back.','《终结者》'],
  ['Here’s looking at you, kid.','《卡萨布兰卡》'],
  ['Houston, we have a problem.','《阿波罗13号》'],
  ['Why so serious?','《蝙蝠侠：黑暗骑士》'],
  ['You jump, I jump.','《泰坦尼克号》'],
  ['To infinity and beyond!','《玩具总动员》'],
  ['Just keep swimming.','《海底总动员》'],
  ['To be, or not to be, that is the question.','《哈姆雷特》'],
  ['我是你爸爸。','《星球大战》'],
  ['有些鸟儿是关不住的，它们的羽毛太美丽了。','《肖申克的救赎》']
];
let qi=Math.floor(Math.random()*QUOTES.length);
const sub=$('sub');
let quoteOn=false,quoteAt=0,silentSince=0;
function showQuote(){
  const q=QUOTES[qi++%QUOTES.length];
  sub.innerHTML='';sub.append(q[0]);
  const s=document.createElement('small');s.textContent=q[1];sub.append(s);
  sub.classList.add('show');
}
/* 字幕只在有声音时出现，静音约 2 秒后淡出；音乐持续时每 8 秒换一句 */
function updateQuote(now,active){
  if(liveText&&src==='mic'){
    if(now-liveAt<6000){quoteOn=false;sub.classList.add('lyric');return}
    liveText='';sub.classList.remove('show');
  }
  if(lyrics.length&&src==='file'&&audioEl){
    quoteOn=false;sub.classList.add('lyric');
    const ct=audioEl.currentTime+lyricOff;let cur='';
    if(!audioEl.paused)for(let i=0;i<lyrics.length&&lyrics[i].t<=ct;i++)cur=lyrics[i].s;
    if(cur!==lyricShown){
      lyricShown=cur;sub.classList.remove('show');clearTimeout(lyricTimer);
      lyricTimer=setTimeout(()=>{if(lyricShown){sub.textContent=lyricShown;sub.classList.add('show')}},250);
    }
    return;
  }
  sub.classList.remove('lyric');clearTimeout(lyricTimer);lyricShown=null;
  if(active){
    silentSince=0;
    if(!quoteOn){quoteOn=true;quoteAt=now;showQuote()}
    else if(now-quoteAt>8000){
      quoteAt=now;sub.classList.remove('show');
      setTimeout(()=>{if(quoteOn)showQuote()},1300);
    }
  }else{
    if(!silentSince)silentSince=now;
    if(quoteOn&&now-silentSince>2000){quoteOn=false;sub.classList.remove('show')}
  }
}

/* ---------- 提示、交互 ---------- */
let noteTimer;
function note(m){const n=$('note');n.textContent=m;n.style.opacity=1;clearTimeout(noteTimer);noteTimer=setTimeout(()=>n.style.opacity=0,3500)}
let idleTimer;
function wake(){document.body.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>document.body.classList.add('idle'),3500)}
['mousemove','keydown','touchstart','click'].forEach(e=>addEventListener(e,wake));
$('bMic').onclick=()=>{startRecog();useMic()};
$('file').onchange=e=>useFiles([...e.target.files]);
$('bDemo').onclick=useDemo;
$('bPrev').onclick=()=>setMode(mode-1);
$('bNext').onclick=()=>setMode(mode+1);
$('bAuto').onclick=e=>{auto=!auto;e.target.classList.toggle('on',auto)};
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>note('当前环境不允许全屏'))}
$('bFs').onclick=fs;
addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='9')setMode(+e.key-1);
  else if(e.key==='0')setMode(9);
  else if(e.key==='ArrowRight')setMode(mode+1);
  else if(e.key==='ArrowLeft')setMode(mode-1);
  else if(e.key==='f'||e.key==='F')fs();
  else if(e.key==='['){lyricOff-=.5;note('歌词延后 0.5 秒（偏移 '+lyricOff.toFixed(1)+'s）')}
  else if(e.key===']'){lyricOff+=.5;note('歌词提前 0.5 秒（偏移 '+lyricOff.toFixed(1)+'s）')}
  else if(e.key===' '&&audioEl){e.preventDefault();audioEl.paused?audioEl.play():audioEl.pause()}
});
addEventListener('resize',layout);

/* ---------- 主循环 ---------- */
let lastBeat=0,bassAvg=0,last=performance.now(),flash=0;
function onBeat(str){
  hue=(hue+25+Math.random()*35)%360;flash=1;
  const cx=W/2;
  for(const p of P){
    const a=Math.atan2(p.y-cy,p.x-cx)+(Math.random()-.5)*1.4;
    const imp=(6+str*22)*(.3+p.r);
    p.vx+=Math.cos(a)*imp;p.vy+=Math.sin(a)*imp;
  }
}
const pad=n=>String(n).padStart(2,'0');
function frame(now){
  const dt=Math.min(.05,(now-last)/1000),f=dt*60;last=now;T=now/1000;
  const d=new Date(),str=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  if(str!==lastStr){lastStr=str;buildTargets(str);
    dateEl.textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}
  readSpec(T);
  let sum=0;for(let i=0;i<BINS;i++){sm[i]=Math.max(raw[i],sm[i]*Math.pow(.88,f));sum+=sm[i]}
  const lv=sum/BINS/255*2.2,bass=(raw[0]+raw[1]+raw[2]+raw[3])/4;
  L+=(Math.min(1,lv)-L)*.25;B+=(Math.min(1,bass/255)-B)*.35;
  bassAvg=bassAvg*.96+bass*.04;
  if(bass>bassAvg*1.25&&bass>100&&now-lastBeat>220){lastBeat=now;onBeat(Math.min(1,(bass-bassAvg)/200+.3))}
  flash*=Math.pow(.9,f);
  updateQuote(now,L>.06);
  if(auto&&now-modeT>10000)setMode(mode+1);

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(5,6,10,.24)';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,cy,0,W/2,cy,Math.max(W,H)*.6);
  g.addColorStop(0,'hsla('+(hue|0)+',80%,45%,'+(.03+B*.12+flash*.08)+')');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  const fn=MODES[mode][1],amp=H*.16*(.35+L*1.3),damp=Math.pow(.82,f),k=.06*f;
  for(let i=0;i<N;i++){
    const p=P[i];
    const ty=p.ty+fn(p)*amp;
    p.vx+=(p.tx-p.x)*k;p.vy+=(ty-p.y)*k;
    p.vx*=damp;p.vy*=damp;p.x+=p.vx*f;p.y+=p.vy*f;
    const s=1.3+L*2.4+p.r*.9,h=(hue+p.u*90+p.r*25)%360;
    ctx.fillStyle='hsla('+(h|0)+',95%,'+((52+L*28+flash*10)|0)+'%,.85)';
    ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
  }
  requestAnimationFrame(frame);
}
layout();
for(const p of P){p.x=Math.random()*W;p.y=Math.random()*H}
setMode(0);wake();
requestAnimationFrame(frame);
</script>
